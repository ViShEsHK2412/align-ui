<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Align — demo page</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!--
    A page with known, exact geometry to measure against.

      #cards        six 160x24 cards at left 24px, the fourth at 25.5px
      #nav          four 80x28 tabs, gutters 16 / 16 / 18px
      #bars         four bars whose right edges run 224 -> 227px
      #measure-pair two marks with a 13.5px gap
      #sticky       40px header, padding 0 16px  (the box model fixture)
      #clean-grid   three 96x64 cells, 16px gutters

    Add ?hmrprobe to track keydown listeners across hot updates.
  -->
  <header id="sticky">align demo — Ctrl/Cmd+Shift+A · click to lock · right-click to add · R rulers · B panel · <a href="/complex.html" style="color:#7aa2f7">hard cases</a></header>

  <main class="stage">
    <!-- 1. six cards, one 1.5px out ------------------------------------- -->
    <section id="cards">
      <div class="card" style="top: 0px"></div>
      <div class="card" style="top: 32px"></div>
      <div class="card" style="top: 64px"></div>
      <div class="card off" style="top: 96px"></div>
      <div class="card" style="top: 128px"></div>
      <div class="card" style="top: 160px"></div>
    </section>

    <!-- 2. nav with a 18px gutter among 16s ------------------------------ -->
    <nav id="nav">
      <a class="tab" href="#">One</a>
      <a class="tab" href="#">Two</a>
      <a class="tab" href="#">Three</a>
      <a class="tab" href="#">Four</a>
    </nav>

    <!-- 3. heading on a half pixel --------------------------------------- -->
    <h2 id="drift-heading">Half-pixel heading</h2>

    <!-- 4. right edges drifting 1px per row ------------------------------ -->
    <section id="bars">
      <div class="bar" style="width: 200px"></div>
      <div class="bar" style="width: 201px"></div>
      <div class="bar" style="width: 202px"></div>
      <div class="bar" style="width: 203px"></div>
    </section>

    <hr class="divider" />

    <!-- clean control: exact grid ---------------------------------------- -->
    <section id="clean-grid">
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
    </section>

    <!-- clean control: fractional gap fixture for Phase 5 ---------------- -->
    <section id="measure-pair">
      <div class="mark a"></div>
      <div class="mark b"></div>
    </section>

    <section id="hidden">
      <div class="card"></div><div class="card"></div><div class="card"></div>
    </section>

    <section id="offscreen">
      <div class="card"></div><div class="card"></div><div class="card"></div>
    </section>

  </main>

  <script type="module" src="./main.ts"></script>
</body>
</html>
